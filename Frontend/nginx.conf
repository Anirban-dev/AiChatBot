server {
    listen 80;

    # 1. Handle Frontend Static Files & React Router Fallback
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # If Nginx can't find the exact file requested (like /login), 
        # it falls back to index.html so React Router can take over
        try_files $uri $uri/ /index.html;
    }

    # 2. Handle Backend API Reverse Proxying
    location /api/ {
        # Catch any request starting with /api/ and pass it to the backend container over the internal Docker network
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}