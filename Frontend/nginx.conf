# Main nginx config for the ChatAI frontend container.
# Serves the SPA and reverse-proxies /api to the backend, with per-IP
# rate limiting on every inbound request (DDoS / flood protection).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ── Per-IP rate limiting zones ─────────────────────────────────────────────
    # 10MB zone ≈ ~160k unique IPs tracked. Applies to the whole server.
    limit_req_zone  $binary_remote_addr  zone=frontend_limit:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m        rate=15r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # 1. Frontend static files & React Router fallback
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            # Rate limit static asset/browse requests per IP
            limit_req zone=frontend_limit burst=40 nodelay;
            try_files $uri $uri/ /index.html;
        }

        # 2. Backend API reverse proxy
        location /api/ {
            # Per-IP API rate limiting before forwarding to the backend
            limit_req zone=api_limit burst=25 nodelay;

            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;

            # Keep long-lived SSE chat streams alive
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}