name: chatai

services:
  searxng:
    image: searxng/searxng
    ports:
      - "8888:8080"
    volumes:
      - ./dump/searxng:/etc/searxng
    restart: on-failure
    networks:
      - backend

  crawl4ai:
    image: unclecode/crawl4ai:latest
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=your_custom_secret_password
    shm_size: '1gb'
    restart: on-failure
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "6379:6379"
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./dump/qdrant_data:/qdrant/storage
    restart: on-failure
    networks:
      - backend

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./dump/mongo_data:/data/db
    restart: on-failure
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

networks:
  backend:
    driver: bridge