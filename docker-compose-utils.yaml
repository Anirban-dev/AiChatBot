name: chatai

services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_REDIS_URL=redis://redis:6379/0
      - SEARXNG_SECRET=a_random_secret_key_change_me_12345
      - SEARXNG_BASE_URL=http://localhost:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend

  crawl4ai:
    image: unclecode/crawl4ai:latest
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
      # Disable the internal egress-pinning proxy — it causes ERR_CONNECTION_CLOSED
      # on Docker bridge networks (the proxy binds to 127.0.0.1 inside the container).
      - CRAWL4AI_EGRESS_NO_PROXY=true
    shm_size: '1gb'
    restart: on-failure
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "6379:6379"
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./dump/qdrant_data:/qdrant/storage
    restart: on-failure
    networks:
      - backend

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./dump/mongo_data:/data/db
    restart: on-failure
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

networks:
  backend:
    driver: bridge