name: chatai

services:
  searxng:
    image: searxng/searxng
    ports:
      - "8888:8080"
    volumes:
      - ./dump/searxng:/etc/searxng
    restart: on-failure
    networks:
      - backend

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - REDIS_URL=${REDIS_URL}
      - REDIS_RATE_LIMIT_URL=${REDIS_URL}
      - DATABASE_URL=${MONGO_URI}
      - ORIGIN_URL=${FIRECRAWL_URL:-http://localhost:3002}
      - LLM_ENABLED=false
      - COREPACK_ENABLE_STRICT=0
      - COREPACK_INTEGRITY_KEYS=0
    command: ["node", "dist/src/index.js"]
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "6379:6379"
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./dump/qdrant_data:/qdrant/storage
    restart: on-failure
    networks:
      - backend

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./dump/mongo_data:/data/db
    restart: on-failure
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

networks:
  backend:
    driver: bridge