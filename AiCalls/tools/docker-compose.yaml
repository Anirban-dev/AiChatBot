services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    restart: always

  firecrawl-api:
    image: trieve/firecrawl:v0.0.46          # ✅ public Docker Hub image
    ports:
      - "3002:3002"
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000
      - PORT=3002
      - HOST=0.0.0.0
      - USE_DB_AUTHENTICATION=false
      - NUM_WORKERS_PER_QUEUE=4
    depends_on:
      - redis
      - playwright-service
    networks:
      - backend

  playwright-service:
    image: trieve/puppeteer-service-ts:v0.0.6  # ✅ public Docker Hub image
    environment:
      - PORT=3000
    networks:
      - backend

  redis:
    image: redis:alpine-6
    networks:
      - backend

networks:
  backend: