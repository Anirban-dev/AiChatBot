[project]
name = "aicalls"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=43.0.0",
    "docling==2.111.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain-community>=0.4.1",
    "langchain-core>=1.4.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.1.10",
    "litellm>=1.86.0",
    "motor>=3.7.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "qdrant-client>=1.18.0",
    "redis>=7.4.0",
    "tabulate>=0.10.0",
    "uvicorn>=0.46.0",
    "youtube-transcript-api>=1.2.4",
    "torch",
    "torchvision",
    "torchaudio"
]

# torch/torchvision/torchaudio stay pinned to the CPU build (they are still
# required transitively by docling) — only the HuggingFace embedding stack
# (langchain-huggingface / sentence-transformers) was removed.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
index-strategy = "unsafe-best-match"