name: chatai

services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # Bakes variables into Vite during the build phase
        - VITE_BASE_URL=${VITE_BASE_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "5173:80"
    restart: on-failure
    depends_on:
      - backend
    networks:
      - backend_net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Automatically falls back to internal container paths if not defined on host
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/AiAssistant}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - AI_API=${AI_API:-http://aicalls:8000/agent}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend_net

  aicalls:
    build:
      context: ./AiCalls
      dockerfile: Dockerfile
    ports:
      - "8005:8000"
    environment:
      - PYTHONUTF8=${PYTHONUTF8:-1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION_PREFIX=${QDRANT_COLLECTION_PREFIX:-chat}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - FIRECRAWL_URL=${FIRECRAWL_URL:-http://firecrawl-api:3002}
      # --- LLM API Keys ---
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY}
      - LIGHTNING_API_KEY=${LIGHTNING_API_KEY}
    restart: on-failure
    depends_on:
      - redis
      - qdrant
    networks:
      - backend_net

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./dump/searxng:/etc/searxng
    restart: on-failure
    networks:
      - backend_net
    depends_on:
      - tor-proxy

  tor-proxy:
    image: leplusorg/tor:latest
    restart: unless-stopped
    environment:
      - SOCKS_HOSTNAME=0.0.0.0
    ports:
      - "9150:9050"
    networks:
      - backend_net

