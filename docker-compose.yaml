name: chatai

services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # Bakes variables into Vite during the build phase
        - VITE_BASE_URL=${VITE_BASE_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "5173:80"
    restart: on-failure
    depends_on:
      - backend
    networks:
      - backend_net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Automatically falls back to internal container paths if not defined on host
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/AiAssistant}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - AI_API=${AI_API:-http://aicalls:8000/agent}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend_net

  aicalls:
    build:
      context: ./AiCalls
      dockerfile: Dockerfile
    ports:
      - "8005:8000"
    environment:
      - PYTHONUTF8=${PYTHONUTF8:-1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/AiAssistant}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION_PREFIX=${QDRANT_COLLECTION_PREFIX:-chat}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - CRAWL4AI_URL=${CRAWL4AI_URL:-http://crawl4ai:11235}
      # Pass the same token that the crawl4ai container uses
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-your_custom_secret_password}
      # --- LLM API Keys ---
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY}
      - LIGHTNING_API_KEY=${LIGHTNING_API_KEY}
    restart: on-failure
    depends_on:
      - redis
      - qdrant
      - crawl4ai
    networks:
      - backend_net

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_REDIS_URL=redis://redis:6379/0
      - SEARXNG_SECRET=a_random_secret_key_change_me_12345
      - SEARXNG_BASE_URL=http://localhost:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - backend_net

  crawl4ai:
    image: unclecode/crawl4ai:latest
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN}
      # Disable the internal egress-pinning proxy — it causes ERR_CONNECTION_CLOSED
      # on Docker bridge networks because the proxy binds to 127.0.0.1 inside the
      # container and is designed for cloud egress control, not Docker networking.
      - CRAWL4AI_EGRESS_NO_PROXY=true
    shm_size: '1gb'
    restart: on-failure
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "6379:6379"
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - backend_net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./dump/qdrant_data:/qdrant/storage
    restart: on-failure
    networks:
      - backend_net

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./dump/mongo_data:/data/db
    restart: on-failure
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge