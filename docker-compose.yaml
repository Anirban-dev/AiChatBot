name: chatai

services:
  # === YOUR THREE APPLICATION SERVICES ===
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    restart: on-failure
    depends_on:
      - backend
    networks:
      - backend_net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/chatai
      - REDIS_URL=redis://redis:6379
    restart: on-failure
    depends_on:
      - mongodb
      - redis
    networks:
      - backend_net

  aicalls:
    build:
      context: ./AiCalls
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    restart: on-failure
    depends_on:
      - redis
      - qdrant
    networks:
      - backend_net

  # === YOUR INFRASTRUCTURE STACK ===
  searxng:
    image: searxng/searxng:latest
    platform: linux/arm64
    ports:
      - "8888:8080"
    volumes:
      - ./dump/searxng:/etc/searxng
    restart: on-failure
    networks:
      - backend_net
    depends_on:
      - tor-proxy

  tor-proxy:
    image: leplusorg/tor:latest
    platform: linux/arm64
    restart: unless-stopped
    environment:
      - SOCKS_HOSTNAME=0.0.0.0
    ports:
      - "9150:9050"
    networks:
      - backend_net

  # Firecrawl stack translated to amd64 emulation for ARM system stability
  firecrawl-api:
    image: trieve/firecrawl:v0.0.46
    platform: linux/amd64
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000
      - DATABASE_URL=mongodb://mongodb:27017/firecrawl
      - ORIGIN_URL=http://localhost:3002
      - LLM_ENABLED=false
      - COREPACK_ENABLE_STRICT=0
      - COREPACK_INTEGRITY_KEYS=0
    command: ["pnpm", "run", "start:production"]
    depends_on:
      - redis
      - playwright-service
      - mongodb
    networks:
      - backend_net

  firecrawl-worker:
    image: trieve/firecrawl:v0.0.46
    platform: linux/amd64
    environment:
      - REDIS_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000
      - DATABASE_URL=mongodb://mongodb:27017/firecrawl
      - COREPACK_ENABLE_STRICT=0
      - COREPACK_INTEGRITY_KEYS=0
    command: ["pnpm", "run", "workers"]
    depends_on:
      - redis
      - playwright-service
      - mongodb
      - firecrawl-api
    networks:
      - backend_net

  playwright-service:
    image: trieve/puppeteer-service-ts:v0.0.6
    platform: linux/amd64
    environment:
      - PORT=3000
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    restart: on-failure
    ports:
      - "6379:6379"
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]
    networks:
      - backend_net

  qdrant:
    image: qdrant/qdrant:latest
    platform: linux/arm64
    ports:
      - "6333:6333"
    volumes:
      - ./dump/qdrant_data:/qdrant/storage
    restart: on-failure
    networks:
      - backend_net

  mongodb:
    image: mongo:7
    platform: linux/arm64
    ports:
      - "27017:27017"
    volumes:
      - ./dump/mongo_data:/data/db
    restart: on-failure
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge