name: chatai

services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    restart: always
    networks:
      - backend

  firecrawl-api:
    image: trieve/firecrawl:v0.0.46
    # ... your existing configs ...
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - REDIS_RATE_LIMIT_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000
      - DATABASE_URL=mongodb://mongodb:27017/firecrawl
      - ORIGIN_URL=http://localhost:3002
      - LLM_ENABLED=false
      - COREPACK_ENABLE_STRICT=0
      - COREPACK_INTEGRITY_KEYS=0
    command: ["pnpm", "run", "start:production"]
    depends_on:
      - redis
      - playwright-service
      - mongodb

  firecrawl-worker:
    image: trieve/firecrawl:v0.0.46
    # ... your existing configs ...
    environment:
      - REDIS_URL=redis://redis:6379
      - PLAYWRIGHT_MICROSERVICE_URL=http://playwright-service:3000
      - DATABASE_URL=mongodb://mongodb:27017/firecrawl
      - COREPACK_ENABLE_STRICT=0
      - COREPACK_INTEGRITY_KEYS=0
    command: ["pnpm", "run", "workers"]
    depends_on:
      - redis
      - playwright-service
      - mongodb
      - firecrawl-api

  playwright-service:
    image: trieve/puppeteer-service-ts:v0.0.6
    environment:
      - PORT=3000
    networks:
      - backend

  redis:
    image: redis:6-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: always
    networks:
      - backend

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
    restart: always
    networks:
      - backend

networks:
  backend:
    driver: bridge