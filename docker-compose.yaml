  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "6379:6379"
    command: ["redis-server", "--ignore-warnings", "ARM64-COW-BUG"]
    networks:
      - backend_net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./dump/qdrant_data:/qdrant/storage
    restart: on-failure
    networks:
      - backend_net

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./dump/mongo_data:/data/db
    restart: on-failure
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge